name: Checks

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vendor links
        run: make vendor

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: palikkaharrastajat
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install "github:cachix/devenv/v2.1.2"

      - name: Cache Elm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
          restore-keys: elm-${{ runner.os }}-

      - name: Check formatting and review
        run: devenv shell --profile ci -- make check

      - name: Run tests
        run: devenv shell --profile ci -- make test
